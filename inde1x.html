<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çelikhane Canlı İzleme Paneli</title>
    
  

    <style>
        /* Sayfanızın daha şık görünmesi için basit bir tasarım */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 20px; color: #333; }
        h1 { color: #2c3e50; border-bottom: 2px solid #34495e; padding-bottom: 10px; }
        .data-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; }
        .data-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 16px; }
        .data-row:last-child { border-bottom: none; }
        .label { font-weight: bold; color: #7f8c8d; }
        .value { color: #2980b9; font-family: monospace; font-weight: bold; }
        .time { font-size: 12px; color: #95a5a6; margin-top: 15px; text-align: right; }
    </style>
</head>
<body>

    <h1>Çelikhane Veri Ekranı</h1>
    
    <div class="data-container">
        <!-- Verilerin yazılacağı alanlar. id nitelikleri JS ile eşleşecek -->
        <div class="data-row">
            <span class="label">BOF 1 Döküm No:</span>
            <span class="value" id="bof1">-</span>
        </div>
        <div class="data-row">
            <span class="label">BOF 2 Döküm No:</span>
            <span class="value" id="bof2">-</span>
        </div>
        <div class="data-row">
            <span class="label">BOF 3 Döküm No:</span>
            <span class="value" id="bof3">-</span>
        </div>
        <div class="time" id="guncelleme-zamani">Yükleniyor...</div>
    </div>

    <script>
        // 2. Supabase Bağlantı Ayarları (Kendi bilgilerinizi buraya yazın)
        const SUPABASE_URL = "https://ywwxiniqgfqrienlybba.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_lkEsztjwQR4Md4kvs7JXmw_2kkTxc2Z";

        // Supabase istemcisini başlatıyoruz
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 3. Veri Tabanından Veriyi Çeken Fonksiyon
        async function verileriGetir() {
            // 'celikhane' tablosundan id'si 1 olan satırı seçiyoruz
            const { data, error } = await supabase
                .from('celikhane')
                .select('bof1_dno, bof2_dno, bof3_dno, takvim')
                .eq('id', 1) 
                .single(); // Tek bir satır beklediğimiz için .single() kullanıyoruz

            if (error) {
                console.error('Supabase okuma hatası:', error);
                document.getElementById('guncelleme-zamani').textContent = "Veri okunamadı!";
                return;
            }

            if (data) {
                // HTML üzerindeki ilgili elementleri veri tabanından gelen verilerle güncelliyoruz
                document.getElementById('bof1').textContent = data.bof1_dno;
                document.getElementById('bof2').textContent = data.bof2_dno;
                document.getElementById('bof3').textContent = data.bof3_dno;
                
                // Zaman damgasını okunabilir formata çevirip yazıyoruz
                const tarih = new Date(data.takvim);
                document.getElementById('guncelleme-zamani').textContent = "Son Güncellenme: " + tarih.toLocaleTimeString();
            }
        }

        // Sayfa tarayıcıda ilk açıldığında verileri hemen yükle
        verileriGetir();

        // 4. MÜKEMMEL KISIM: Canlı (Realtime) Dinleyici Aktif Etme
        // Veri tabanında 'celikhane' tablosunda herhangi bir UPDATE olduğunda otomatik tetiklenir
        supabase
            .channel('celikhane-canli-akis')
            .on(
                'postgres_changes',
                { event: 'UPDATE', schema: 'public', table: 'celikhane', filter: 'id=eq.1' },
                (payload) => {
                    console.log('Veri tabanında güncelleme algılandı!', payload.new);
                    // Sayfayı yenilemeden sadece ekrandaki yazıları günceller
                    verileriGetir(); 
                }
            )
            .subscribe();
    </script>
</body>
</html>
