<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üretim Takip Paneli</title>
    <!-- Supabase CDN Kütüphanesi -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Üst Filtre ve Buton Alanı */
        .filter-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eef2f5;
            flex-wrap: wrap;
        }

        .inputs-container {
            display: flex;
            gap: 20px;
            flex-grow: 1;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-width: 150px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
        }

        .input-group input, 
        .input-group select {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            background-color: #fff;
            height: 41px;
        }

        .input-group input[type="date"],
        .input-group select {
            cursor: pointer;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .buttons-container {
            display: flex;
            gap: 12px;
            margin-bottom: 2px;
        }

        .btn {
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            height: 41px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-sorgula {
            background-color: #2563eb;
            color: white;
        }

        .btn-sorgula:hover {
            background-color: #1d4ed8;
        }

        .btn-anasayfa {
            background-color: #64748b;
            color: white;
        }

        .btn-anasayfa:hover {
            background-color: #475569;
        }

        /* Tablo Alanı (Yan Yana Yapı) */
        .tables-wrapper {
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        .table-container {
            background-color: #ffffff;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .table-main {
            flex: 7;
        }

        .table-side {
            flex: 3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
            table-layout: fixed;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        th {
            background-color: #1e293b;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        td {
            color: #334155;
        }

        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        .status-row {
            text-align: center;
            font-style: italic;
            color: #64748b;
        }

        .col-std { width: 12.5%; }
        .col-wide { width: 25%; }
        .col-half { width: 50%; }

        @media (max-width: 992px) {
            .tables-wrapper {
                flex-direction: column;
            }
            .table-container {
                width: 100%;
            }
            .filter-wrapper {
                flex-direction: column;
                align-items: stretch;
            }
            .buttons-container {
                justify-content: flex-end;
                margin-top: 10px;
            }
            table {
                table-layout: auto;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Üst Kontrol Paneli -->
    <div class="filter-wrapper">
        <div class="inputs-container">
            <div class="input-group">
                <label for="uretimGunu">Üretim Günü</label>
                <input type="date" id="uretimGunu">
            </div>
            
            <div class="input-group">
                <label for="konum">Konum</label>
                <select id="konum">
                    <option value="ALL" selected>Genel Analizler</option>
                    <option value="DESU">DESU</option>
                    <option value="Çukurlar">Çukurlar</option>
                    <option value="Konverterler">Konverterler</option>
                    <option value="Pota Fırınları">Pota Fırınları</option>
                    <option value="Vakum">Vakum</option>
                    <option value="SDM1">SDM1</option>
                    <option value="SDM2">SDM2</option>
                    <option value="SDM3">SDM3</option>
                    <option value="Yüksek Fırınlar">Yüksek Fırınlar</option>
                </select>
            </div>
            
            <div class="input-group">
                <label for="dokumNo">Döküm No</label>
                <input type="text" id="dokumNo" placeholder="Örn: DK-9482">
            </div>
        </div>
        
        <div class="buttons-container">
            <button class="btn btn-sorgula" id="btnSorgula">Sorgula</button>
            <button class="btn btn-anasayfa">Anasayfa</button>
        </div>
    </div>

    <!-- Yan Yana Tablolar -->
    <div class="tables-wrapper">
        
        <!-- 1. Tablo (Dinamik Supabase Verisi) -->
        <div class="table-container table-main">
            <table>
                <colgroup>
                    <col class="col-std">
                    <col class="col-std">
                    <col class="col-std">
                    <col class="col-std">
                    <col class="col-wide">
                    <col class="col-wide">
                </colgroup>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Döküm No</th>
                        <th>Smp.No</th>
                        <th>Konum</th>
                        <th>Açıklama</th>
                        <th>Tarih</th>
                    </tr>
                </thead>
                <tbody id="supabaseTableBody">
                    <tr>
                        <td colspan="6" class="status-row">Lütfen bekleyin, veriler yükleniyor...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 2. Tablo (Bileşen Bilgileri) -->
        <div class="table-container table-side">
            <table>
                <colgroup>
                    <col class="col-half">
                    <col class="col-half">
                </colgroup>
                <thead>
                    <tr>
                        <th>Bileşen</th>
                        <th>Yüzde</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Demir (Fe)</td>
                        <td>% 92.4</td>
                    </tr>
                    <tr>
                        <td>Karbon (C)</td>
                        <td>% 4.2</td>
                    </tr>
                    <tr>
                        <td>Silisyum (Si)</td>
                        <td>% 2.1</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</div>

<script>
    // ------ VERİTABANI AYARLARI ------
    // TODO: Supabase projenize ait benzersiz URL ve Anon Key değerlerini buraya girin.
    const SUPABASE_URL = "https://ywwxiniqgfqrienlybba.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_lkEsztjwQR4Md4kvs7JXmw_2kkTxc2Z";
    const TABLO_ADI = "analyses_tbl"; 
    
    // Supabase İstemci Değişkeni
    let supabaseClient = null;

    document.addEventListener('DOMContentLoaded', () => {
        // 1. ÖNCE TARİHİ ATAYALIM (Veritabanı hata verse bile tarih dolacaktır)
        const dateInput = document.getElementById('uretimGunu');
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        dateInput.value = `${year}-${month}-${day}`;

        // 2. SUPABASE BAĞLANTISINI KONTROL EDEREK BAŞLATALIM
        try {
            if (typeof supabase !== 'undefined') {
                // Tarayıcı CDN üzerinden yüklenen ana nesne 'supabase'dir
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                // Bağlantı başarılı ise ilk sorguyu yap
                veriGetir();
            } else {
                throw new Error("Supabase kütüphanesi yüklenemedi. İnternet bağlantınızı kontrol edin.");
            }
        } catch (err) {
            console.error(err);
            document.getElementById('supabaseTableBody').innerHTML = `<tr><td colspan="6" class="status-row" style="color: #dc2626;">Bağlantı Başlatılamadı: ${err.message}</td></tr>`;
        }

        // 3. Sorgula butonuna basıldığında tabloyu silip yeniden sorgula
        document.getElementById('btnSorgula').addEventListener('click', () => {
            if (supabaseClient) {
                veriGetir();
            } else {
                alert("Supabase bağlantısı kurulamadığı için sorgulama yapılamıyor.");
            }
        });
    });

    async function veriGetir() {
        const tableBody = document.getElementById('supabaseTableBody');
        
        // Tabloyu tamamen temizle ve yükleniyor yazısı ekle
        tableBody.innerHTML = '<tr><td colspan="6" class="status-row">Veritabanından güncel kayıtlar çekiliyor...</td></tr>';

        // Filtre elemanlarından anlık seçilen değerleri oku
        const secilenTarih = document.getElementById('uretimGunu').value; // Format: YYYY-MM-DD
        const secilenKonum = document.getElementById('konum').value;
        const girilenDokumNo = document.getElementById('dokumNo').value.trim();

        try {
            // Temel sorguyu oluştur
            let query = supabaseClient.from(TABLO_ADI).select('*');

            // --- ZAMAN FİLTRESİ ---
            query = query.gte('ANA_DATE', `${secilenTarih}T00:00:00`)
                         .lte('ANA_DATE', `${secilenTarih}T23:59:59`);

            // --- KONUM FİLTRESİ (LOCAT) ---
            if (secilenKonum !== 'ALL') {
                query = query.eq('LOCAT', secilenKonum);
            }

            // --- DÖKÜM NO FİLTRESİ (HT_NO) ---
            if (girilenDokumNo !== '') {
                query = query.ilike('HT_NO', `%${girilenDokumNo}%`);
            }

            // İstekte bulun
            const { data, error } = await query;

            if (error) throw error;

            // Tabloyu gelen yeni veriler için tamamen boşalt
            tableBody.innerHTML = '';

            if (!data || data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" class="status-row">Seçilen kriterlere uygun hiçbir veri bulunamadı.</td></tr>';
                return;
            }

            // Gelen verileri döngüyle Tablo 1'e satır olarak ekle
            data.forEach(item => {
                const tr = document.createElement('tr');
                const formatliTarih = item.ANA_DATE ? new Date(item.ANA_DATE).toLocaleString('tr-TR') : '';

                tr.innerHTML = `
                    <td>${item.ANA_NO ?? ''}</td>
                    <td>${item.HT_NO ?? ''}</td>
                    <td>${item.SMP_NO ?? ''}</td>
                    <td>${item.LOCAT ?? ''}</td>
                    <td>${item.DESCR ?? ''}</td>
                    <td>${formatliTarih}</td>
                `;
                tableBody.appendChild(tr);
            });

        } catch (error) {
            console.error("Supabase Sorgu Hatası:", error);
            tableBody.innerHTML = `<tr><td colspan="6" class="status-row" style="color: #dc2626; font-weight: 600;">Veri yükleme hatası: ${error.message}</td></tr>`;
        }
    }
</script>
