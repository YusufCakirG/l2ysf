<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üretim Takip Paneli</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Üst Filtre ve Buton Alanı */
        .filter-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eef2f5;
            flex-wrap: wrap;
        }

        .inputs-container {
            display: flex;
            gap: 20px;
            flex-grow: 1;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-width: 150px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
        }

        .input-group input, 
        .input-group select {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            background-color: #fff;
            height: 41px;
        }

        .input-group input[type="date"],
        .input-group select {
            cursor: pointer;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .buttons-container {
            display: flex;
            gap: 12px;
            margin-bottom: 2px;
        }

        .btn {
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            height: 41px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-sorgula {
            background-color: #2563eb;
            color: white;
        }

        .btn-sorgula:hover {
            background-color: #1d4ed8;
        }

        .btn-anasayfa {
            background-color: #64748b;
            color: white;
        }

        .btn-anasayfa:hover {
            background-color: #475569;
        }

        /* Tablo Alanı */
        .tables-wrapper {
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        .table-container {
            background-color: #ffffff;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .table-main {
            flex: 7;
        }

        .table-side {
            flex: 3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
            table-layout: fixed;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        th {
            background-color: #1e293b;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        td {
            color: #334155;
        }

        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        .status-row {
            text-align: center;
            font-style: italic;
            color: #64748b;
        }

        .col-std { width: 12.5%; }
        .col-wide { width: 25%; }
        .col-half { width: 50%; }

        @media (max-width: 992px) {
            .tables-wrapper {
                flex-direction: column;
            }
            .table-container {
                width: 100%;
            }
            .filter-wrapper {
                flex-direction: column;
                align-items: stretch;
            }
            .buttons-container {
                justify-content: flex-end;
                margin-top: 10px;
            }
            table {
                table-layout: auto;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Üst Kontrol Paneli -->
    <div class="filter-wrapper">
        <div class="inputs-container">
            <div class="input-group">
                <label for="uretimGunu">Üretim Günü</label>
                <input type="date" id="uretimGunu">
            </div>
            
            <div class="input-group">
                <label for="konum">Konum</label>
                <select id="konum">
                    <option value="ALL" selected>Genel Analizler</option>
                    <option value="DESU">DESU</option>
                    <option value="Çukurlar">Çukurlar</option>
                    <option value="Konverterler">Konverterler</option>
                    <option value="Pota Fırınları">Pota Fırınları</option>
                    <option value="Vakum">Vakum</option>
                    <option value="SDM1">SDM1</option>
                    <option value="SDM2">SDM2</option>
                    <option value="SDM3">SDM3</option>
                    <option value="Yüksek Fırınlar">Yüksek Fırınlar</option>
                </select>
            </div>
            
            <div class="input-group">
                <label for="dokumNo">Döküm No</label>
                <input type="text" id="dokumNo" placeholder="Örn: DK-9482">
            </div>
        </div>
        
        <div class="buttons-container">
            <button class="btn btn-sorgula" id="btnSorgula">Sorgula</button>
          <a href="index.html">
    <button class="btn btn-anasayfa">Anasayfa</button>
</a>
        </div>
    </div>

    <!-- Yan Yana Tablolar <a href="index.html" class="btn btn-anasayfa">Anasayfa</a>  -->
    <div class="tables-wrapper">
        
        <!-- 1. Tablo (Dinamik Veri Alanı) -->
        <div class="table-container table-main">
            <table>
                <colgroup>
                    <col class="col-std">
                    <col class="col-std">
                    <col class="col-std">
                    <col class="col-std">
                    <col class="col-wide">
                    <col class="col-wide">
                </colgroup>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Döküm No</th>
                        <th>Smp.No</th>
                        <th>Konum</th>
                        <th>Açıklama</th>
                        <th>Tarih</th>
                    </tr>
                </thead>
                <tbody id="supabaseTableBody">
                    <tr>
                        <td colspan="6" class="status-row">Veriler bekleniyor...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 2. Tablo (Bileşen Bilgileri) -->
        <div class="table-container table-side">
            <table>
                <colgroup>
                    <col class="col-half">
                    <col class="col-half">
                </colgroup>
                <thead>
                    <tr>
                        <th>Bileşen</th>
                        <th>Yüzde</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Demir (Fe)</td>
                        <td>% 92.4</td>
                    </tr>
                    <tr>
                        <td>Karbon (C)</td>
                        <td>% 4.2</td>
                    </tr>
                    <tr>
                        <td>Silisyum (Si)</td>
                        <td>% 2.1</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</div>
    <!-- En büyük ANA_NO değerini getiren buton ve sonuç alanı -->
<button id="btnEnBuyukAnaNo" onclick="enBuyukAnaNoGetir()" style="background-color: #28a745; color: white; padding: 10px 15px; border: none; cursor: pointer; border-radius: 4px; font-weight: bold;">
    📊 En Büyük ANA_NO Getir
</button>

<div id="sonucAlani" style="margin-top: 15px; font-size: 16px; font-weight: bold; color: #333;">
    En Büyük ANA_NO: <span id="txtAnaNo">-</span>
</div>

<script>
    // ------ VERİTABANI AYARLARI ------
    const SUPABASE_URL = "https://ywwxiniqgfqrienlybba.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_lkEsztjwQR4Md4kvs7JXmw_2kkTxc2Z";
    const TABLO_ADI = "analyses_tbl"; 

    // Sayfa Yüklendiğinde Çalışacak Fonksiyonlar
    document.addEventListener('DOMContentLoaded', () => {
        // Bugünün tarihini otomatik ata
        const dateInput = document.getElementById('uretimGunu');
        if (dateInput) {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            dateInput.value = `${year}-${month}-${day}`;
        }

        // İlk açılışta verileri otomatik çek
        veriGetir();

        // Sorgula butonu tetikleyici
        const btnSorgula = document.getElementById('btnSorgula');
        if (btnSorgula) {
            btnSorgula.addEventListener('click', () => {
                veriGetir();
            });
        }
    });

    // 1. FONKSİYON: En Büyük ANA_NO Değerini Getiren Buton Kodları
    async function enBuyukAnaNoGetir() {
        const txtAnaNo = document.getElementById('txtAnaNo');
        if (!txtAnaNo) return;
        
        txtAnaNo.innerText = "Yükleniyor...";
        txtAnaNo.style.color = "orange";

        const sorguParametreleri = "?select=ANA_NO&order=ANA_NO.desc&limit=1";
        const apiTargetUrl = `${SUPABASE_URL}/rest/v1/${TABLO_ADI}${sorguParametreleri}`;

        try {
            const response = await fetch(apiTargetUrl, {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_ANON_KEY,
                    "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
                    "Content-Type": "application/json"
                }
            });

            if (!response.ok) {
                throw new Error(`Sunucu Hatası: ${response.status}`);
            }

            const veriler = await response.json();

            if (!veriler || veriler.length === 0) {
                txtAnaNo.innerText = "Tabloda hiç kayıt bulunamadı.";
                txtAnaNo.style.color = "red";
                return;
            }

            // En büyük değer listenin ilk elemanının içindedir
            const enBuyukAnaNo = veriler[0].ANA_NO;
            
            txtAnaNo.innerText = enBuyukAnaNo;
            txtAnaNo.style.color = "#28a745"; 
            console.log("En Büyük ANA_NO Başarıyla Çekildi:", enBuyukAnaNo);

        } catch (error) {
            console.error("En büyük ANA_NO çekilirken hata oluştu:", error);
            txtAnaNo.innerText = "Hata oluştu!";
            txtAnaNo.style.color = "red";
        }
    } // <-- UNUTULAN KAPATMA PARANTEZİ BURAYA EKLENDİ

    // 2. FONKSİYON: Ana Tabloya Verileri Çeken Kodlar
    async function veriGetir() {
        const tableBody = document.getElementById('supabaseTableBody');
        if (!tableBody) return;
        
        tableBody.innerHTML = '<tr><td colspan="6" class="status-row">Veritabanından güncel kayıtlar çekiliyor...</td></tr>';
        
        const uretimGunuInput = document.getElementById('uretimGunu');
        const konumInput = document.getElementById('konum');
        const dokumNoInput = document.getElementById('dokumNo');

        const secilenTarih = uretimGunuInput ? uretimGunuInput.value : '';
        const secilenKonum = konumInput ? konumInput.value : 'ALL';
        const girilenDokumNo = dokumNoInput ? dokumNoInput.value.trim() : '';

        try {
            const apiTargetUrl = `${SUPABASE_URL}/rest/v1/${TABLO_ADI}?select=*`;
            
            const response = await fetch(apiTargetUrl, {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_ANON_KEY,
                    "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
                    "Content-Type": "application/json"
                }
            });

            if (!response.ok) {
                throw new Error(`HTTP Hata Kodu: ${response.status}`);
            }

            let data = await response.json();

            // 1. Tarih Süzgeci (ANA_DATE)
            if (secilenTarih) {
                data = data.filter(item => item.ANA_DATE && item.ANA_DATE.startsWith(secilenTarih));
            }
            
            // 2. Konum Süzgeci (LOCAT)
            if (secilenKonum !== 'ALL') {
                data = data.filter(item => item.LOCAT === secilenKonum);
            }
            
            // 3. Döküm No Süzgeci (HT_NO)
            if (girilenDokumNo !== '') {
                data = data.filter(item => item.HT_NO && String(item.HT_NO).toLowerCase().includes(girilenDokumNo.toLowerCase()));
            }

            // Tabloyu tamamen temizle ve verileri yazdır
            tableBody.innerHTML = '';
            
            if (data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" class="status-row">Seçilen kriterlere uygun hiçbir veri bulunamadı.</td></tr>';
                return;
            }

            // Tablo satırlarını oluştur
            data.forEach(item => {
                const tr = document.createElement('tr');
                const formatliTarih = item.ANA_DATE ? new Date(item.ANA_DATE).toLocaleString('tr-TR') : '';
                tr.innerHTML = `
                    <td>${item.ANA_NO ?? ''}</td>
                    <td>${item.HT_NO ?? ''}</td>
                    <td>${item.SMP_NO ?? ''}</td>
                    <td>${item.LOCAT ?? ''}</td>
                    <td>${item.DESCR ?? ''}</td>
                    <td>${formatliTarih}</td>
                `;
                tableBody.appendChild(tr);
            });

        } catch (error) {
            console.error("Hata detayı:", error);
            tableBody.innerHTML = "<tr><td colspan='6' class='status-row' style='color: #dc2626; font-weight: 600;'>Veri yükleme hatası: " + error.message + "</td></tr>";
        }
    }
</script>
